# Builds and pushes the GPU worker image. Run from the repo root:
#   gcloud builds submit --project lomb-prod --region us-east4 --config worker/cloudbuild.yaml
# The Hugging Face token reaches the build only as a BuildKit secret (not a
# build arg), so it never lands in an image layer or the build log.
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["HF_TOKEN"]
    args:
      - build
      - --secret=id=hf_token,env=HF_TOKEN
      - -f=worker/Dockerfile
      - -t=us-east4-docker.pkg.dev/$PROJECT_ID/lomb/worker:$BUILD_ID
      - -t=us-east4-docker.pkg.dev/$PROJECT_ID/lomb/worker:latest
      - .
images:
  - us-east4-docker.pkg.dev/$PROJECT_ID/lomb/worker:$BUILD_ID
  - us-east4-docker.pkg.dev/$PROJECT_ID/lomb/worker:latest
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hf-token/versions/latest
      env: HF_TOKEN
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
